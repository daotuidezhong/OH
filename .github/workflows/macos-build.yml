name: Build desktop installers

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Reuse validated installer artifacts from this run (empty builds macOS only)
        type: string
        default: ''
      release_commit:
        description: Exact commit of the release artifacts being resumed
        type: string
        default: ''
  push:
    branches: [codex/macos-data-migration, codex/orange-focus-update, codex/next-update-v0.9.9, codex/calendar-planner]

jobs:
  validate-release:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Publish v')
    permissions:
      contents: read
    uses: ./.github/workflows/validate.yml

  build-macos:
    # 提交说明带 [windows-only] 的发布只打 Windows 包（Mac 下次再发）
    if: (github.event_name != 'workflow_dispatch' || inputs.release_run_id == '') && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[windows-only]'))
    runs-on: macos-15
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:build:mac -- --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: OH-macOS-${{ matrix.arch }}
          path: outputs/*.dmg
          if-no-files-found: error

  build-windows:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Publish v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build --config desktop/vite.config.ts
      - run: npx --yes electron-builder@26.0.12 --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: OH-Windows-x64
          path: |
            outputs/*.exe
            outputs/*.blockmap
            outputs/latest.yml
          if-no-files-found: error

  publish-release:
    if: >-
      always() &&
      ((github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Publish v') &&
        needs.validate-release.result == 'success' && needs.build-windows.result == 'success' &&
        (needs.build-macos.result == 'success' || (needs.build-macos.result == 'skipped' && contains(github.event.head_commit.message, '[windows-only]')))) ||
       (github.event_name == 'workflow_dispatch' && inputs.release_run_id != '' && inputs.release_commit != ''))
    needs: [validate-release, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_commit || github.sha }}
      - name: Verify source build run
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_SHA: ${{ inputs.release_commit }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}" > source-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}/jobs?per_page=100" > source-jobs.json
          node --input-type=module -e 'import fs from "node:fs"; const run = JSON.parse(fs.readFileSync("source-run.json", "utf8")); const { jobs } = JSON.parse(fs.readFileSync("source-jobs.json", "utf8")); if (run.head_sha !== process.env.RELEASE_SHA || ["validate-release / validate", "build-macos (arm64)", "build-macos (x64)", "build-windows"].some(name => !jobs.some(job => job.name === name && job.conclusion === "success"))) throw new Error("Source artifacts do not have successful validation and all three builds for this commit");'
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
          run-id: ${{ inputs.release_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_commit || github.sha }}
          RELEASE_WINDOWS_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[windows-only]') && '1' || '' }}
        run: |
          version=$(node -p "require('./package.json').version")
          node build/verify-release.mjs release-assets
          if gh release view "v${version}" --json isDraft,targetCommitish > release-state.json; then
            node --input-type=module -e 'import fs from "node:fs"; const release = JSON.parse(fs.readFileSync("release-state.json", "utf8")); if (!release.isDraft || release.targetCommitish !== process.env.RELEASE_SHA) throw new Error("Refusing to overwrite an existing release or another commit");'
          else
            gh release create "v${version}" --draft --target "$RELEASE_SHA" --title "OH v${version}" --notes-file "docs/releases/v${version}.md"
          fi
          gh release upload "v${version}" release-assets/* --clobber
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq ".[] | select(.tag_name == \"v${version}\")" > uploaded-release.json
          node build/verify-release.mjs release-assets uploaded-release.json
          gh release edit "v${version}" --draft=false --latest --notes-file "docs/releases/v${version}.md"
