name: Build desktop installers

on:
  workflow_dispatch:
  push:
    branches: [codex/macos-data-migration, codex/orange-focus-update, codex/next-update-v0.9.9]

jobs:
  validate-release:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Publish v')
    permissions:
      contents: read
    uses: ./.github/workflows/validate.yml

  build-macos:
    runs-on: macos-15
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:build:mac -- --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: OH-macOS-${{ matrix.arch }}
          path: outputs/*.dmg
          if-no-files-found: error

  build-windows:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Publish v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build --config desktop/vite.config.ts
      - run: npx --yes electron-builder@26.0.12 --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: OH-Windows-x64
          path: |
            outputs/*.exe
            outputs/*.blockmap
            outputs/latest.yml
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Publish v')
    needs: [validate-release, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          node build/verify-release.mjs release-assets
          if gh release view "v${version}" --json isDraft,targetCommitish > release-state.json; then
            node --input-type=module -e 'import fs from "node:fs"; const release = JSON.parse(fs.readFileSync("release-state.json", "utf8")); if (!release.isDraft || release.targetCommitish !== process.env.GITHUB_SHA) throw new Error("Refusing to overwrite an existing release or another commit");'
          else
            gh release create "v${version}" --draft --target "$GITHUB_SHA" --title "OH v${version}" --notes-file "docs/releases/v${version}.md"
          fi
          gh release upload "v${version}" release-assets/* --clobber
          gh release edit "v${version}" --draft=false --latest --notes-file "docs/releases/v${version}.md"
